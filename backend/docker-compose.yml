version: '3.9'

services:
  user-service:
    build: ./users
    container_name: user-service
    env_file:
      - ./users/.env
    ports:
      - "3001:3001"
    networks:
      - backend

  auth-service:
    build: ./auth
    container_name: auth-service
    env_file:
      - ./auth/.env
    ports:
      - "3002:3002"
    depends_on:
      - user-service
    networks:
      - backend

  gateway:
    image: nginx:latest
    container_name: gateway
    ports:
      - "80:80"
      # - "443:443"
    depends_on:
      - user-service
      - auth-service
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - backend

networks:
  backend:
    external: true
    name: backend-network